[package]
name = "shuriken"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A fast, lightweight, ninja-compatible build engine, usable as a library or standalone binary"
license = "MIT OR Apache-2.0"
authors = ["Alec Nunn <alec.nunn@gmail.com>"]
repository = "https://github.com/alecnunn/shuriken"
homepage = "https://github.com/alecnunn/shuriken"
documentation = "https://docs.rs/shuriken"
keywords = ["ninja", "build", "build-system", "buildtool"]
categories = ["development-tools::build-utils"]
readme = "README.md"
exclude = ["/dev", "/.github"]

[lib]
name = "shuriken"
path = "src/lib.rs"

[[bin]]
name = "shuriken"
path = "src/bin/shuriken/main.rs"

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
